<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Tikka Masala Chat Corner</title>
  <meta name="description" content="Login to your Tikka Masala Chat Corner account.">
  <link rel="stylesheet" href="/css/main.css?v=2">
  <link rel="stylesheet" href="/css/customer.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🫙</div>
        <h1 class="auth-title">Welcome Back!</h1>
        <p class="auth-subtitle">Sign in to Tikka Masala Chat Corner</p>
      </div>

      <div id="login-error" class="alert alert-error hidden"></div>

      <form id="login-form" onsubmit="handleCustomerLogin(event)">
        <div class="form-group">
          <label class="form-label" for="mobile">📱 Mobile Number</label>
          <input class="form-control" type="tel" id="mobile" placeholder="Enter 10-digit mobile" maxlength="10" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">🔒 Password</label>
          <input class="form-control" type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="login-btn" type="submit">
          Login
        </button>
      </form>

      <div class="divider"><span>OR</span></div>

      <div class="text-center">
        <p class="text-muted mb-2">Don't have an account?</p>
        <a href="/customer/register.html" class="btn btn-outline btn-block">Create Account</a>
      </div>

      <div class="text-center mt-2">
        <small class="text-muted">
          <a href="/admin/login.html" style="color:var(--text-muted)">Admin Login →</a>
        </small>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/js/api.js?v=3"></script>
  <script src="/js/auth.js"></script>
  <script>redirectIfLoggedIn('customer');</script>
</body>
</html>
