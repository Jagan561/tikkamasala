<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Tikka Masala Chat Corner</title>
  <meta name="description" content="Admin panel login for Tikka Masala Chat Corner management.">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { background: linear-gradient(135deg, #9B0A22 0%, #C8102E 50%, #E87722 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .login-card { background: #fff; border-radius: var(--radius-xl); box-shadow: 0 32px 80px rgba(0,0,0,.25); width: 100%; max-width: 420px; overflow: hidden; }
    .login-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 2.5rem 2rem; text-align: center; }
    .login-icon { width: 64px; height: 64px; background: rgba(255,255,255,.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; }
    .login-header h1 { color: #fff; font-size: 1.5rem; margin-bottom: .25rem; }
    .login-header p { color: rgba(255,255,255,.7); font-size: .85rem; }
    .login-body { padding: 2rem; }
    .demo-box { background: #FFF3E0; border: 1px solid #FFB74D; border-radius: var(--radius-sm); padding: .9rem 1.1rem; margin-bottom: 1.5rem; font-size: .85rem; color: #7A4000; }
    .demo-box strong { display: block; margin-bottom: .25rem; color: #5D2E00; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1>Admin Panel</h1>
      <p>Tikka Masala Chat Corner Management</p>
    </div>
    <div class="login-body">
      <div class="demo-box">
        <strong>🧪 Demo Credentials</strong>
        Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>Admin@123</code>
      </div>

      <div id="login-error" class="alert alert-error hidden"></div>

      <form id="admin-login-form" onsubmit="handleAdminLogin(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter admin username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative">
            <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required style="padding-right:3rem">
            <button type="button" onclick="togglePwd()" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-muted)" id="pwd-eye">👁️</button>
          </div>
        </div>
        <button type="submit" id="admin-login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem">
          Sign In to Dashboard
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--text-muted)">
        <a href="../index.html" style="color:var(--primary)">← Back to Store</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    redirectIfLoggedIn('admin');

    function togglePwd() {
      const inp = document.getElementById('password');
      const eye = document.getElementById('pwd-eye');
      if (inp.type === 'password') { inp.type = 'text'; eye.textContent = '🙈'; }
      else { inp.type = 'password'; eye.textContent = '👁️'; }
    }
  </script>
</body>
</html>
