<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Tikka Masala Chat Corner</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/customer.css">
</head>
<body>
<nav class="navbar">
  <a href="/customer/home.html" class="navbar-brand">
    <div class="navbar-logo">🫙</div>
    <div class="navbar-brand-text">
      <span class="brand-name">Tikka Masala</span>
      <span class="brand-tagline">Chat Corner</span>
    </div>
  </a>
  <button class="hamburger" onclick="document.getElementById('nav-menu').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
  <ul class="navbar-nav" id="nav-menu">
    <li><a href="/customer/home.html" class="nav-link">🏠 Home</a></li>
    <li><a href="/customer/menu.html" class="nav-link active">🍽️ Menu</a></li>
    <li><a href="/customer/my-orders.html" class="nav-link">📋 My Orders</a></li>
    <li>
      <a href="/customer/cart.html" class="nav-link" style="position:relative">
        🛒 Cart <span class="badge-count cart-badge hidden">0</span>
      </a>
    </li>
    <li><a href="/customer/profile.html" class="nav-link">👤 Profile</a></li>
    <li><button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button></li>
  </ul>
</nav>

<div style="background:linear-gradient(135deg,var(--primary-dark),var(--primary));padding:2.5rem 2rem 1.5rem;text-align:center">
  <h1 style="color:#fff;margin-bottom:.5rem">Our Menu 🍽️</h1>
  <p style="color:rgba(255,255,255,.8)">Fresh, authentic chaat — straight from our kitchen</p>
</div>

<div class="container" style="padding-top:2rem;padding-bottom:3rem">
  <!-- Search + filter bar -->
  <div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
    <input class="form-control" style="max-width:300px" type="search" id="search-input" placeholder="🔍 Search menu..." oninput="handleSearch(this.value)">
    <label style="display:flex;align-items:center;gap:.5rem;font-size:.9rem;cursor:pointer">
      <input type="checkbox" id="avail-only" onchange="renderProducts()"> Available only
    </label>
  </div>
  <!-- Category pills -->
  <div class="category-pills" id="category-pills"></div>
  <!-- Products grid -->
  <div class="grid-3" id="products-grid">
    <p class="text-muted text-center" style="grid-column:1/-1">Loading menu...</p>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/products.js"></script>
<script>
  requireCustomerAuth();
  loadCart();
  loadProducts();
</script>
</body>
</html>
