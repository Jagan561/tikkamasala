<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Tikka Masala Chat Corner</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/customer.css">
</head>
<body>
<nav class="navbar">
  <a href="/customer/home.html" class="navbar-brand">
    <div class="navbar-logo">🫙</div>
    <div class="navbar-brand-text"><span class="brand-name">Tikka Masala</span><span class="brand-tagline">Chat Corner</span></div>
  </a>
  <ul class="navbar-nav">
    <li><a href="/customer/home.html" class="nav-link">🏠 Home</a></li>
    <li><a href="/customer/my-orders.html" class="nav-link">📋 Orders</a></li>
    <li><button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button></li>
  </ul>
</nav>

<div class="container" style="max-width:500px;padding-top:2rem;padding-bottom:4rem">
  <div class="card">
    <div class="card-body text-center">
      <div class="profile-avatar" id="profile-avatar">👤</div>
      <h2 id="profile-name">Loading...</h2>
      <p class="text-muted" id="profile-mobile">—</p>
      <span class="badge badge-success mt-1">✅ Verified Account</span>
    </div>
  </div>

  <div class="card mt-2">
    <div class="card-body">
      <h3 style="margin-bottom:1rem">Account Info</h3>
      <div style="display:flex;flex-direction:column;gap:.75rem">
        <div style="display:flex;justify-content:space-between;padding:.75rem;background:var(--bg);border-radius:var(--radius-sm)">
          <span class="text-muted">Name</span>
          <strong id="info-name">—</strong>
        </div>
        <div style="display:flex;justify-content:space-between;padding:.75rem;background:var(--bg);border-radius:var(--radius-sm)">
          <span class="text-muted">Mobile</span>
          <strong id="info-mobile">—</strong>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:.75rem;margin-top:1.5rem">
    <a href="/customer/my-orders.html" class="btn btn-outline btn-block">📋 My Orders</a>
    <button class="btn btn-ghost btn-block" onclick="logout()" style="color:var(--error)">🚪 Logout</button>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  requireCustomerAuth();
  const user = getUser();
  if (user.name) {
    document.getElementById('profile-name').textContent = user.name;
    document.getElementById('profile-mobile').textContent = user.mobile;
    document.getElementById('info-name').textContent = user.name;
    document.getElementById('info-mobile').textContent = user.mobile;
    document.getElementById('profile-avatar').textContent = user.name.charAt(0).toUpperCase();
  }
</script>
</body>
</html>
