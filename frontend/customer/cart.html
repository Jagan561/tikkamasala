<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Tikka Masala Chat Corner</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/customer.css">
</head>
<body>
<nav class="navbar">
  <a href="/customer/home.html" class="navbar-brand">
    <div class="navbar-logo">🫙</div>
    <div class="navbar-brand-text">
      <span class="brand-name">Tikka Masala</span>
      <span class="brand-tagline">Chat Corner</span>
    </div>
  </a>
  <button class="hamburger" onclick="document.getElementById('nav-menu').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
  <ul class="navbar-nav" id="nav-menu">
    <li><a href="/customer/home.html" class="nav-link">🏠 Home</a></li>
    <li><a href="/customer/menu.html" class="nav-link">🍽️ Menu</a></li>
    <li><a href="/customer/my-orders.html" class="nav-link">📋 My Orders</a></li>
    <li><a href="/customer/cart.html" class="nav-link active">🛒 Cart</a></li>
    <li><a href="/customer/profile.html" class="nav-link">👤 Profile</a></li>
    <li><button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button></li>
  </ul>
</nav>

<div class="container" style="padding-top:2rem;padding-bottom:4rem;max-width:800px">
  <h1 style="margin-bottom:1.5rem">🛒 Your Cart</h1>

  <div id="cart-empty" class="empty-state hidden">
    <div class="empty-icon">🛒</div>
    <h3>Your cart is empty</h3>
    <p>Add some delicious chaat to get started!</p>
    <a href="/customer/menu.html" class="btn btn-primary mt-2">Browse Menu</a>
  </div>

  <div id="cart-summary">
    <div class="card mb-2">
      <div class="card-body">
        <div id="cart-items-list"></div>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="order-summary mb-2">
      <h3 style="margin-bottom:1rem">Order Summary</h3>
      <div class="order-summary-row">
        <span id="summary-items">0 items</span>
        <span id="summary-subtotal">₹0</span>
      </div>
      <div class="order-summary-row">
        <span>Delivery fee (estimated)</span>
        <span>₹30</span>
      </div>
      <div class="order-summary-row total">
        <span>Total</span>
        <span class="amount" id="summary-total">₹0</span>
      </div>
    </div>

    <div style="display:flex;gap:1rem;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="clearCart()">🗑 Clear Cart</button>
      <a href="/customer/checkout.html" class="btn btn-primary btn-lg" style="flex:1">Proceed to Checkout →</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script>
  requireCustomerAuth();
  loadCart().then(() => {
    // Update total preview (delivery is confirmed at checkout with location)
    const totalEl = document.getElementById('summary-total');
    if (totalEl) {
      const total = (_cart.subtotal || 0) + 30;
      totalEl.textContent = formatPrice(total);
    }
  });
</script>
</body>
</html>
